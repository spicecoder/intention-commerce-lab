name: intention-commerce-lab

services:
  orders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders-dev-only
    volumes:
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 3s
      timeout: 3s
      retries: 30

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory-dev-only
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 3s
      timeout: 3s
      retries: 30

  orders:
    build: ./apps/orders-node
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://orders:orders-dev-only@orders-db:5432/orders
    ports:
      - "${ORDERS_PORT:-3001}:3001"
    depends_on:
      orders-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  inventory:
    build: ./apps/inventory-spring
    environment:
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://inventory-db:5432/inventory
      DATABASE_USERNAME: inventory
      DATABASE_PASSWORD: inventory-dev-only
      DATABASE_DRIVER: org.postgresql.Driver
      INVENTORY_FAILURE_MODE: ${INVENTORY_FAILURE_MODE:-none}
      INVENTORY_FAILURE_DELAY_MS: ${INVENTORY_FAILURE_DELAY_MS:-7000}
    ports:
      - "${INVENTORY_PORT:-8081}:8081"
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health/liveness"]
      interval: 5s
      timeout: 3s
      retries: 40

volumes:
  orders-data:
  inventory-data:
