spring:
  datasource:
    url: jdbc:h2:mem:inventory-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
inventory:
  failure-mode: none
  failure-delay-ms: 10
logging:
  level:
    root: warn
